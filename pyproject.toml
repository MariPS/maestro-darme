[project]
name="maestro-darme"
version="0.1.0"
requires-python=">=3.11"
dependencies=[
    "requests",         # download from Wiktenauer
    "beautifulsoup4",   # navigate the HTML
    "lxml",             # fast HTML parser used by BeautifulSoup
    "pydantic",         # data schema (validation of passages)
]

[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[tool.setuptools.packages.find]
where=["src"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]